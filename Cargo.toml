[package]
name = "tix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal per-repo issue tracker for humans and agents: append-only JSONL event log with a derived SQLite FTS cache"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"
